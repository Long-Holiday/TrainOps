<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TrainOps · 项目计划</title>
<style>
/* 视觉：一张纸。以中性色为主，颜色只留给状态与结论；执行中节点与实例行共用一组
   固定的实例身份色，不使用渐变、图标库或持续动画。
   全部为静态 CSS，不引外部资源；改完跑 node tests/test_web.cjs。 */
:root {
  color-scheme:light;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace;
  --paper:#f5f4f0; --surface:#fbfaf7; --raise:#ffffff;
  --ink:#1b1b18; --muted:#716f68;
  --line:#e0ded7; --line-strong:#c9c6bd;
  --running:#2f5fd0; --done:#26704a; --blocked:#946411; --failed:#b0342c;
  --inst-0:#6d28d9; --inst-1:#db2777; --inst-2:#0891b2;
  --inst-3:#c026d3; --inst-4:#0ea5e9;
  --edge:#c2bfb6;
  --r-ctl:6px; --r-panel:8px; --r-node:6px; --r-dialog:10px;
}
:root[data-theme="dark"] {
  color-scheme:dark;
  --paper:#121310; --surface:#181a16; --raise:#1e201c;
  --ink:#e9e8e2; --muted:#9c9a91;
  --line:#292b26; --line-strong:#3e413a;
  --running:#8aa8ff; --done:#68c18d; --blocked:#d3a44e; --failed:#f0837a;
  --inst-0:#b39dff; --inst-1:#f472b6; --inst-2:#22d3ee;
  --inst-3:#e879f9; --inst-4:#7dd3fc;
  --edge:#454840;
}
/* 实例身份色只做归属提示：相同编号的实例行与执行中节点用同一色条 */
.inst-color-0 { --inst-color:var(--inst-0); }
.inst-color-1 { --inst-color:var(--inst-1); }
.inst-color-2 { --inst-color:var(--inst-2); }
.inst-color-3 { --inst-color:var(--inst-3); }
.inst-color-4 { --inst-color:var(--inst-4); }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font:15px/1.6 var(--sans); -webkit-font-smoothing:antialiased; }
main { max-width:1240px; margin:0 auto; padding:34px 32px 44px; }
p { margin:0; }
h1 { margin:0; font-size:30px; font-weight:650; line-height:1.2; letter-spacing:-.02em; }
h2 { margin:0; font-size:16px; font-weight:600; }
.meta,.muted { color:var(--muted); font-size:13px; }
.id { font-family:var(--mono); font-variant-numeric:tabular-nums; }
.hidden { display:none; }
header { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap; padding-bottom:20px; }
.eyebrow { margin:0 0 8px; font-family:var(--mono); font-size:11.5px; font-weight:600; letter-spacing:.04em; color:var(--muted); text-transform:uppercase; }
.meta { margin-top:7px; font-family:var(--mono); font-variant-numeric:tabular-nums; }
.controls { display:flex; align-items:center; gap:6px; }
button { font:inherit; font-size:13px; color:var(--ink); background:transparent; border:1px solid var(--line-strong); border-radius:var(--r-ctl); padding:6px 12px; cursor:pointer; transition:border-color .12s,color .12s,background-color .12s; }
button:hover { border-color:var(--ink); }
button:active { transform:translateY(1px); }
button:disabled { opacity:.45; cursor:progress; }
button:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
button.ghost { border-color:transparent; color:var(--muted); padding:6px 8px; }
button.ghost:hover { border-color:transparent; color:var(--ink); background:var(--surface); }
.notice { display:flex; gap:10px; align-items:flex-start; margin:0 0 18px; padding:10px 14px; border:1px solid var(--line); border-left:3px solid var(--failed); border-radius:var(--r-panel); background:var(--surface); color:var(--failed); font-size:13.5px; }
/* 关闭态必须压过上面的 display:flex；DOM 桩看不见层叠，test_web.cjs 盯着这行字面量。 */
.notice.hidden { display:none; }
/* 读数条：一条细线下面的纯文本读数，不是一排药丸标签 */
.summary { display:flex; flex-wrap:wrap; align-items:center; border-top:1px solid var(--line); border-bottom:1px solid var(--line); font-size:13px; }
.summary-total { padding:12px 22px 12px 0; font-weight:600; }
.metric { display:inline-flex; align-items:center; gap:7px; padding:12px 20px; border-left:1px solid var(--line); color:var(--muted); white-space:nowrap; }
.metric b { font-family:var(--mono); font-size:14px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
.metric .dot { width:7px; height:7px; }
.metric.budget { color:var(--ink); font-weight:600; }
.metric.budget b { font-size:17px; letter-spacing:-.01em; }
.metric.note b { color:var(--muted); }
.verdict { padding:12px 20px; border-left:1px solid var(--line); font-weight:600; white-space:nowrap; }
.verdict.good { color:var(--done); }
.verdict.bad { color:var(--failed); }
.settled { flex-basis:100%; padding:9px 0 10px; border-top:1px dashed var(--line); font-family:var(--mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
.settled.bad { border-top-style:solid; border-top-color:var(--blocked); color:var(--blocked); }
/* 实例：和读数条一样的横线列表，不是浮在纸面上的卡片 */
.instances { margin:4px 0 26px; border-top:1px solid var(--line); }
.instances:empty { display:none; }
.instance { display:grid; grid-template-columns:4.2rem minmax(9rem,1fr) auto auto; gap:5px 20px; align-items:center; padding:12px 0 12px 12px; border-bottom:1px solid var(--line); border-left:6px solid var(--inst-color,transparent); }
.instance-id { grid-column:1; grid-row:1; font-family:var(--mono); font-size:12.5px; font-weight:600; color:var(--muted); }
.instance-name { grid-column:2; grid-row:1; min-width:0; font-weight:600; overflow-wrap:anywhere; }
.instance-meta { grid-column:2 / -1; grid-row:2; min-width:0; color:var(--muted); font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.instance .status { grid-column:3; grid-row:1; justify-self:end; }
.price { grid-column:4; grid-row:1; justify-self:end; font-family:var(--mono); font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums; padding:4px 10px; }
.price.unset { color:var(--blocked); border-color:var(--blocked); border-style:dashed; }
.price.unset:hover { border-style:solid; }
button.token.unset,.token.unset { color:var(--blocked); border-color:var(--blocked); border-style:dashed; }
.status { display:inline-flex; align-items:center; gap:7px; white-space:nowrap; font-size:13px; color:var(--muted); flex-shrink:0; }
.dot { width:7px; height:7px; border-radius:50%; background:var(--line-strong); flex-shrink:0; }
.running .dot { background:var(--running); }
.done .dot,.on .dot { background:var(--done); }
.blocked .dot,.starting .dot { background:var(--blocked); }
.failed .dot,.unreachable .dot { background:var(--failed); }
/* 主图 */
.diagram { margin-top:26px; }
.diagram-header { display:flex; justify-content:space-between; align-items:flex-end; gap:10px 20px; flex-wrap:wrap; padding-bottom:12px; }
.diagram-sub { margin-top:4px; font-family:var(--mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
.diagram-hint { font-family:var(--mono); font-size:11.5px; color:var(--muted); }
.flow-index { display:flex; flex-wrap:wrap; gap:5px 20px; padding:0 0 14px; font-size:12.5px; color:var(--muted); }
.flow-item { display:inline-flex; align-items:baseline; gap:6px; max-width:100%; flex-wrap:wrap; overflow-wrap:anywhere; }
.flow-item b { color:var(--ink); font-family:var(--mono); font-weight:600; }
.flow-progress { color:var(--ink); font-family:var(--mono); font-variant-numeric:tabular-nums; }
.canvas-viewport { position:relative; max-height:72vh; overflow:auto; border:1px solid var(--line); border-radius:var(--r-panel); background:var(--surface); }
.canvas { position:relative; }
.diagram-title { min-width:0; }
.diagram-switch { display:flex; flex-shrink:0; gap:6px; margin-left:auto; }
.diagram-view[aria-pressed="true"] { color:var(--ink); border-color:var(--ink); background:var(--raise); }
.queue-viewport { margin-top:12px; padding:20px 16px; }
.queue-lane + .queue-lane { margin-top:24px; padding-top:20px; border-top:1px solid var(--line); }
.queue-label { position:sticky; left:0; width:fit-content; max-width:100%; margin:0 0 12px; font:600 13px var(--mono); color:var(--ink); overflow-wrap:anywhere; }
.queue-row { display:flex; align-items:flex-start; width:max-content; min-width:100%; }
.task-node.queue-node { width:280px; flex:none; }
.queue-edge { position:relative; flex:none; width:64px; margin-top:72px; border-top:2px dashed var(--edge); }
.queue-edge::after { content:""; position:absolute; right:0; top:-5px; border-top:4px solid transparent; border-bottom:4px solid transparent; border-left:7px solid var(--edge); }
.queue-row .queue-node + .queue-node { margin-left:16px; }
.queue-reason { margin-top:5px; color:var(--muted); font-size:12px; }
/* 连线只表达依赖：中性细线，最后一段带箭头；任务节点始终盖在线上方 */
.canvas-edge { position:absolute; height:0; border-top:1.5px solid var(--edge); transform-origin:0 0; z-index:0; pointer-events:none; }
.canvas-edge.arrow::after { content:""; position:absolute; right:-1px; top:-5px; border-top:4.5px solid transparent; border-bottom:4.5px solid transparent; border-left:7px solid var(--edge); }
.task-node { position:relative; padding:13px 15px; border:1px solid var(--line-strong); border-left-width:6px; border-radius:var(--r-node); background:var(--raise); overflow-wrap:anywhere; }
.task-node.canvas-node { position:absolute; width:280px; z-index:1; }
.task-node:target { outline:2px solid var(--ink); outline-offset:3px; }
.task-node.running { border-left-color:var(--inst-color,var(--running)); }
.task-node.done { border-left-color:var(--done); }
.task-node.blocked { border-left-color:var(--blocked); }
.task-node.failed { border-left-color:var(--failed); }
.task-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.task-title { display:flex; align-items:baseline; gap:8px; min-width:0; flex:1 1 180px; flex-wrap:wrap; }
.task-id { flex-shrink:0; font-family:var(--mono); font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
.task-name { min-width:0; font-weight:600; font-size:14.5px; white-space:normal; overflow-wrap:anywhere; }
.tags { display:flex; gap:4px 14px; flex-wrap:wrap; margin-top:8px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
.instance-tag { color:var(--ink); font-family:var(--mono); }
.task-progress { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
.task-meter { display:inline-block; width:64px; height:3px; flex-shrink:0; border-radius:2px; background:var(--line); overflow:hidden; }
.task-meter-fill { display:block; height:100%; background:var(--ink); }
.task-progress-value { color:var(--ink); font-family:var(--mono); }
.task-eta { display:flex; gap:4px 12px; flex-wrap:wrap; margin-top:7px; font-size:12px; line-height:1.5; color:var(--muted); font-variant-numeric:tabular-nums; }
.eta-done { color:var(--done); }
.eta-failed { color:var(--failed); }
.eta-cancelled { color:var(--muted); }
.eta-overdue { color:var(--blocked); font-weight:600; }
.eta-stale { color:var(--blocked); }
.empty { padding:34px 16px; color:var(--muted); font-size:13px; font-family:var(--mono); text-align:center; border:1px solid var(--line); border-radius:var(--r-panel); }
.page-foot { margin-top:18px; padding-top:16px; border-top:1px solid var(--line); font-family:var(--mono); font-size:11.5px; color:var(--muted); }
.page-foot code { color:var(--ink); }
/* 弹窗是全页唯一有投影的元素；关闭态必须用 #modal.hidden 压过 #modal 的 display:flex */
#modal { position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; padding:20px; }
#modal.hidden { display:none; }
.modal-backdrop { position:absolute; inset:0; background:rgba(10,10,8,.42); }
.dialog { position:relative; width:100%; max-width:400px; padding:22px 24px; border:1px solid var(--line-strong); border-radius:var(--r-dialog); background:var(--raise); box-shadow:0 24px 56px -24px rgba(8,8,6,.5); }
.dialog-title { margin:0 0 14px; font-size:15.5px; font-weight:650; }
.dialog-hint { margin:0 0 14px; font-size:12.5px; line-height:1.55; color:var(--muted); }
.dialog-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.dialog input { flex:1; min-width:0; padding:8px 11px; border:1px solid var(--line-strong); border-radius:var(--r-ctl); background:var(--surface); color:var(--ink); font:15px var(--mono); }
.dialog input:focus-visible { outline:2px solid var(--ink); outline-offset:1px; border-color:var(--ink); }
.dialog-error { margin:0 0 14px; font-size:13px; line-height:1.5; color:var(--failed); }
.dialog-actions { display:flex; justify-content:flex-end; gap:8px; }
.dialog-actions .primary { border-color:var(--ink); background:var(--ink); color:var(--paper); font-weight:600; }
.dialog-actions .primary:hover { border-color:var(--ink); opacity:.88; }
@media(max-width:760px) {
  main { padding:22px 16px 32px; }
  h1 { font-size:24px; }
  header { align-items:flex-start; gap:14px; }
  .summary-total,.metric,.verdict { padding-top:9px; padding-bottom:9px; padding-right:14px; }
  .metric { padding-left:14px; }
  .instance { grid-template-columns:3.4rem minmax(0,1fr) auto; }
  .instance .status { grid-column:2; grid-row:3; justify-self:start; }
  .instance .price { grid-column:3; grid-row:1 / span 2; }
}
</style>
</head>
<body>
<main>
<header>
  <div class="brand">
    <p class="eyebrow">TrainOps · 多实例训练计划</p>
    <h1 id="title">项目计划</h1>
    <p class="meta" id="updated">正在读取…</p>
  </div>
  <div class="controls">
    <button id="token" class="ghost" type="button">Token</button>
    <button id="refresh" type="button">刷新</button>
    <button id="theme" class="ghost" type="button">深色</button>
  </div>
</header>
<div class="notice hidden" id="error" role="alert"></div>
<section class="summary" id="summary" aria-live="polite"></section>
<section class="instances" id="instances"></section>
<section class="diagram" id="diagram"></section>
<p class="page-foot">数据源 <code>.agent/experiment.yaml</code> · 时价与 Token 可在面板登记（Token 只存本进程内存），其余修改请通过 agent / CLI</p>
<div id="modal" class="hidden"></div>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const names = {pending:'待执行',running:'执行中',blocked:'阻塞',done:'已完成',failed:'失败',cancelled:'已取消',unknown:'未观测',off:'已关机',starting:'开机中',on:'开机',unreachable:'不可达'};
let plan = null;
let loading = false;
let diagramMode = 'queue';
let scrollLeft = 0, scrollTop = 0;   // 画布是原生滚动容器，刷新后保留滚动位置
const CANVAS_PAD = 64;    // 画布四周留白
const NODE_W = 280;       // 任务节点宽度
const COL_PITCH = 380;    // 网格列距 = 节点宽 + 100px 连线空隙
const ROW_PITCH = 210;    // 网格行距
const PORT_Y = 72;        // 连线在节点行内的接入高度（约为常见节点高度的中线）
const INSTANCE_COLORS = 5; // 与 CSS 的 --inst-0..4 对应；实例多时循环复用

function el(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined && text !== null) node.textContent = String(text);
  if (className) node.className = className;
  return node;
}
function css(node, styleText) {
  node.setAttribute('style', styleText);
  return node;
}
function when(value) {
  if (!value) return '待估';
  return new Date(value).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
}
function money(value) {
  return '¥' + Number(value).toFixed(2);
}
/* 实例身份色：按 I01、I02… 的编号固定分配，新增/删除实例不会打乱其它实例的颜色。
   仅执行中节点和实例行使用；local、未知编号或无实例的任务不参与。 */
function instanceColor(id) {
  if (!id || id === 'local') return null;
  const match = /^I(\d+)$/.exec(id);
  if (match) return (Number(match[1]) - 1) % INSTANCE_COLORS;
  const index = plan && plan.instances ? plan.instances.findIndex(item => item.id === id) : -1;
  return index >= 0 ? index % INSTANCE_COLORS : null;
}
function instanceClass(id) {
  const index = instanceColor(id);
  return index === null ? '' : ' inst-color-' + index;
}
function dot() {
  return el('span',null,'dot');
}
function status(value) {
  const node = el('span',null,'status ' + value);
  node.append(dot(),el('span',names[value] || value));
  return node;
}
/* 两个弹窗共用一套壳：输入、提示、错误都留在 #modal 里，轮询重绘碰不到正在输入的值。 */
function closeDialog() {
  $('modal').replaceChildren();
  $('modal').classList.add('hidden');
}
function openDialog(config) {
  const backdrop = el('div',null,'modal-backdrop');
  backdrop.addEventListener('click',closeDialog);
  const dialog = el('div',null,'dialog');
  dialog.setAttribute('role','dialog');
  dialog.setAttribute('aria-modal','true');
  dialog.append(el('h2',config.title,'dialog-title'));
  if (config.hint) dialog.append(el('p',config.hint,'dialog-hint'));
  const input = el('input',null,'dialog-input');
  input.type = config.type || 'text';
  input.autocomplete = 'off';
  input.spellcheck = false;
  input.value = config.value === undefined || config.value === null ? '' : String(config.value);
  input.setAttribute('aria-label',config.ariaLabel || config.title);
  if (config.type === 'number') {
    input.step = '0.01';
    input.min = '0.001';
    input.max = '10000';
  }
  const row = el('div',null,'dialog-row');
  row.append(input,el('span',config.unit || '','muted'));
  const note = el('p',null,'dialog-error hidden');
  const actions = el('div',null,'dialog-actions');
  const clear = config.clearText ? el('button',config.clearText) : null;
  const cancel = el('button','取消');
  const save = el('button',config.saveText || '保存','primary');
  for (const button of [clear,cancel,save]) if (button) button.type = 'button';
  if (clear) actions.append(clear);
  actions.append(cancel,save);
  dialog.append(row,note,actions);

  const fail = message => { note.className = 'dialog-error'; note.textContent = message; };
  const advise = message => { note.className = 'dialog-hint'; note.textContent = message; };
  const submit = async value => {
    save.disabled = true;
    if (clear) clear.disabled = true;
    note.className = 'dialog-error hidden';
    try {
      const response = await fetch(config.url,{method:'POST',
        headers:{'Content-Type':'application/json'},body:JSON.stringify(config.body(value))});
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || '登记失败');
      plan = data;                     // 服务端回的就是新快照，不必等下一轮轮询
      closeDialog();
      $('error').classList.add('hidden');
      render();
    } catch (failure) {
      fail((config.errorPrefix || '登记失败：') + failure.message + (config.errorSuffix || ''));
    } finally {
      save.disabled = false;
      if (clear) clear.disabled = false;
    }
  };
  const commit = () => {
    const raw = input.value.trim();
    if (!raw) return advise(config.emptyHint);
    if (config.validate) {
      const problem = config.validate(raw);
      if (problem) return advise(problem);
    }
    submit(config.valueFor ? config.valueFor(raw) : raw);
  };
  save.addEventListener('click',commit);
  if (clear) clear.addEventListener('click',() => submit(null));
  cancel.addEventListener('click',closeDialog);
  input.addEventListener('keydown',event => {
    if (event.key === 'Enter') commit();
    else if (event.key === 'Escape') closeDialog();
  });
  $('modal').replaceChildren(backdrop,dialog);
  $('modal').classList.remove('hidden');
  input.focus();
  return input;
}
/* 时价是面板的写入口之一。无卡开机（含持续请求等待 GPU）登记的是另一档费率；
   开机模式由 agent 核实后经 CLI 写进计划，面板只读不写。 */
function priceButton(item) {
  const noGpu = item.mode === 'no-gpu';
  const current = noGpu ? item.no_gpu_price : item.price;
  const known = current !== null && current !== undefined;
  const button = el('button',
    known ? (noGpu ? '无卡 ¥' + current : '¥' + current) + '/h' : (noGpu ? '无卡 费率未登记' : '登记时价'),
    'price' + (known ? '' : ' unset'));
  button.type = 'button';
  button.title = noGpu
    ? (known ? '无卡开机按 ' + money(current) + '/h 计费，点击修改无卡费率'
             : '无卡开机但没登记费率，余额换算不出可用时长；点击登记')
    : (known ? '当前登记 GPU 时价 ' + money(current) + '/h，点击修改'
             : '未登记 GPU 时价，余额换算不出可用时长；点击登记');
  button.addEventListener('click',() => openPrice(item));
  return button;
}
function openPrice(item) {
  const noGpu = item.mode === 'no-gpu';
  const current = noGpu ? item.no_gpu_price : item.price;
  openDialog({
    title:(noGpu ? '登记无卡费率' : '登记 GPU 时价') + ' · ' + item.id + ' ' + item.name,
    hint:noGpu
      ? '当前是无卡开机（含持续请求等待 GPU）：没有 GPU 在计费，这里登记的是无卡费率。GPU 模式开机后再登记 GPU 时价。'
      : '登记的是标价，不是一次观测，不会刷新实例的观测时间；不登记就不计算 GPU 时间，余额也算不出还能跑多久。',
    type:'number',
    unit:'元/小时',
    ariaLabel:(noGpu ? '无卡费率' : 'GPU 时价') + '（元/小时）',
    value:current,
    clearText:'清空时价',
    emptyHint:'还没填单价：不登记就不计算 GPU 时间，余额也算不出还能跑多久。要撤销已有的登记请点「清空时价」。',
    validate:raw => Number.isFinite(Number(raw)) ? '' : '时价要填数字（元/小时）。',
    valueFor:raw => Number(raw),
    url:'/api/instance-price',
    body:value => noGpu ? {id:item.id,no_gpu_price:value} : {id:item.id,price:value},
    errorPrefix:'登记失败：',
    errorSuffix:'（计划未改动）',
  });
}
/* Token 只进服务端内存：客户端不落 localStorage、不预填、提交成功即清空输入。
   状态由服务端给：只有“配没配、什么时候配的”，值本身不经过任何响应。 */
function credentials() {
  return (plan && plan.credentials) || {configured:false,set_at:null};
}
function renderTokenButton() {
  const view = credentials();
  const button = $('token');
  button.className = 'ghost token' + (view.configured ? '' : ' unset');
  button.title = view.configured
    ? 'Token 已登记' + (view.set_at ? '（' + when(view.set_at) + '）' : '')
      + '，只在这个面板进程的内存里；点击可更换或清除'
    : '未登记 Token：面板不刷新余额，也算不出还能跑多久；点击粘贴控制台 → 设置 → 开发者Token';
}
function openToken() {
  const view = credentials();
  openDialog({
    title:'登记开发者 Token',
    hint:'Token 只存在这个面板进程的内存里：重启面板要重新填写。接口只用它做只读余额查询，'
      + '不写进计划、日志或任何文件。获取路径：AutoDL 控制台 → 设置 → 开发者Token。',
    type:'password',
    ariaLabel:'AutoDL 开发者 Token',
    value:'',
    clearText:'清除 Token',
    emptyHint:'还没填 Token：不登记就不刷新余额，也算不出还能跑多久。要撤销已登记的凭据请点「清除 Token」。',
    url:'/api/token',
    body:value => ({token:value}),
    errorPrefix:'登记失败：',
    errorSuffix:'',
  });
}
/* 余额与可用时长：数据缺一项就少显示一项，绝不把缺失当成 0。
   代金券单独标注——否则“2 元现金 + 500 元代金券”会被读成还能跑很久。 */
function budgetNodes(budget) {
  if (!budget || budget.assets === null || budget.assets === undefined) return [];
  const nodes = [];
  const amount = el('span',null,'metric budget');
  amount.append(el('span','余额 '),el('b',money(budget.assets)));
  if (budget.observed_age) {
    amount.append(el('span','观测于 ' + budget.observed_age));
    amount.title = '余额观测于 ' + when(budget.observed_at) + '，不是实时数字；面板登记 Token 后会按周期刷新';
  }
  nodes.push(amount);
  if (budget.voucher) {
    const voucher = el('span',null,'metric note');
    voucher.append(el('span','代金券 '),el('b',money(budget.voucher)),el('span','（不计入可用时长）'));
    nodes.push(voucher);
  }
  if (typeof budget.hours_awake === 'number') {
    const hours = el('span',null,'metric');
    hours.append(el('span','现价可跑 '),el('b',budget.hours_awake + ' 小时'));
    hours.title = '按当前开机费率合计 ' + money(budget.burn_rate) + '/h 粗算（无卡实例按无卡费率），未计代金券';
    nodes.push(hours);
  }
  if (typeof budget.plan_gpu_hours === 'number') {
    const rest = el('span',null,'metric');
    rest.append(el('span','跑完剩余计划 '),el('b',budget.plan_gpu_hours + ' GPU 小时'));
    if (typeof budget.plan_cost === 'number') rest.append(el('span','≈ ' + money(budget.plan_cost)));
    nodes.push(rest);
  }
  if (typeof budget.covers_plan === 'boolean') {
    nodes.push(el('span',budget.covers_plan ? '余额够跑完' : '余额不足，请充值或缩减计划',
      'verdict ' + (budget.covers_plan ? 'good' : 'bad')));
  }
  return nodes;
}
function settlementNode(settlement) {
  if (!settlement || !settlement.text) return null;
  const node = el('span',settlement.text,'settled' + (settlement.over ? ' bad' : ''));
  if (settlement.computed_at) node.title = '自动结算于 ' + when(settlement.computed_at) + '；由面板进程按周期重算';
  return node;
}
function instanceLabel(id) {
  if (!id) return '未分配实例';
  if (id === 'local') return '本机';
  const item = plan.instances.find(entry => entry.id === id);
  return item ? item.id + ' ' + item.name : id;
}
/* 流程读数：只给完成计数与总进度，画布仍只有一张 */
function flowIndex() {
  const row = el('div',null,'flow-index');
  for (const flow of plan.flows) {
    const view = flow.view;
    const item = el('span',null,'flow-item');
    item.append(el('b',flow.id),el('span',flow.name));
    if (!view.total) {
      item.append(el('span','暂无任务'));
    } else if (view.countable) {
      item.append(el('span',view.done + '/' + view.countable + ' 完成'
        + (view.cancelled ? ' · 已取消 ' + view.cancelled : ''),'flow-progress'));
      item.append(el('span',view.progress + '%'));
      item.title = view.known && view.finish
        ? (view.open ? '预计 ' : '完成 ') + when(view.finish) : '完成待估';
    } else {
      item.append(el('span','已全部取消（' + view.cancelled + ' 个任务）'));
    }
    row.append(item);
  }
  return row;
}
function renderInstances() {
  const nodes = plan.instances.map(item => {
    const node = el('article',null,'instance' + instanceClass(item.id));
    node.append(el('span',item.id,'instance-id'),el('span',item.name,'instance-name'));
    const running = item.view.running;
    node.append(el('span',item.ssh_alias + ' · '
      + (running.length ? '运行 ' + running.join(',') : '空闲')
      + ' · 待跑 ' + item.view.queued,'instance-meta'));
    node.append(status(item.status),priceButton(item));
    return node;
  });
  $('instances').replaceChildren(...nodes);
}
function renderSummary() {
  const counts = plan.stats.counts;
  const summary = [el('span',plan.stats.flows + ' 条流程 / ' + plan.stats.tasks + ' 个任务','summary-total')];
  for (const key of ['running','pending','done','blocked','failed'].filter(k => counts[k] || k === 'running' || k === 'done')) {
    const item = el('span',null,'metric ' + key);
    item.append(dot(),el('span',names[key] + ' '),el('b',counts[key]));
    summary.push(item);
  }
  summary.push(...budgetNodes(plan.budget));
  const settled = settlementNode(plan.settlement);
  if (settled) summary.push(settled);
  $('summary').replaceChildren(...summary);
}
/* 面板不做业务计算：队列顺序、依赖层级、进度与 ETA 都由服务端下发。
   两种视图共用任务卡片；资源排队与真实依赖使用不同连线语义。 */
function taskCard(task, percent, flowById) {
  const node = el('article',null,'task-node ' + task.status
    + (task.status === 'running' ? instanceClass(task.instance) : ''));
  node.id = 'task-' + task.id;
  const top = el('div',null,'task-top');
  const titleWrap = el('div',null,'task-title');
  titleWrap.append(el('span',task.id,'task-id'),el('span',task.name,'task-name'));
  top.append(titleWrap,status(task.status));
  const meta = el('div',null,'tags');
  meta.append(el('span',instanceLabel(task.instance),'instance-tag'));
  const flow = flowById.get(task.flow);
  if (flow) meta.append(el('span',flow.id + ' ' + flow.name));
  if (task.note) meta.append(el('span',task.note));
  node.append(top,meta);
  const progress = el('div',null,'task-progress');
  const meter = el('span',null,'task-meter');
  meter.append(css(el('span',null,'task-meter-fill'),'width:' + percent + '%'));
  progress.append(el('span','进度'),meter,el('span',percent + '%','task-progress-value'));
  node.append(progress);
  const eta = el('div',null,'task-eta');
  if (task.status === 'done') {
    eta.append(el('span','✓ ' + when(task.finished_at) + ' 完成','eta-done'));
  } else if (['failed','cancelled'].includes(task.status)) {
    /* 取消不是失败：红色只留给 failed，取消按“已经停下”的中性口径显示 */
    eta.append(el('span',when(task.finished_at) + ' 结束',task.status === 'cancelled' ? 'eta-cancelled' : 'eta-failed'));
  } else if (task.estimate.overdue) {
    eta.append(el('span','已超过预计完成时间，需重新估计','eta-overdue'));
  } else {
    eta.append(el('span',(task.estimate.finish ? '预计 ' + when(task.estimate.finish) + ' 完成' : '完成待估')
      + (task.duration_minutes !== null ? ' (' + task.duration_minutes + 'm)' : '')));
  }
  if (task.estimate.stale) eta.append(el('span','超过 1 小时未巡检','eta-stale'));
  node.append(eta);
  return node;
}
function diagramSwitch(heading) {
  const controls = el('div',null,'diagram-switch');
  controls.setAttribute('aria-label','任务图视图');
  for (const [mode,label] of [['queue','执行队列'],['dependency','前置依赖']]) {
    const button = el('button',label,'diagram-view');
    button.setAttribute('aria-pressed',String(diagramMode === mode));
    button.addEventListener('click',() => {
      diagramMode = mode;
      scrollLeft = 0; scrollTop = 0;
      renderDiagram();
    });
    controls.append(button);
  }
  heading.append(controls);
}
function renderQueues() {
  const section = el('section',null,'diagram');
  const heading = el('div',null,'diagram-header');
  const title = el('div',null,'diagram-title');
  title.append(el('h2','任务执行队列'),el('p','按当前实例分配与排程规则展示候选顺序，不代表已在远端启动','diagram-sub'));
  heading.append(title);
  diagramSwitch(heading);
  section.append(heading,flowIndex(),el('p','虚线箭头 = 同实例计划排队，不是前置依赖；未知耗时不影响候选顺序，改派或状态变化后重算。','diagram-hint'));
  const tasks = new Map(plan.tasks.map(task => [task.id,task]));
  const flows = new Map(plan.flows.map(flow => [flow.id,flow]));
  const progress = new Map(plan.graph.nodes.map(node => [node.id,node.progress]));
  const viewport = el('div',null,'canvas-viewport queue-viewport');
  viewport.setAttribute('role','group');
  viewport.setAttribute('aria-label','实例执行队列，可横向滚动');
  const addLane = (label, ids, connected) => {
    const lane = el('section',null,'queue-lane');
    lane.append(el('h3',label,'queue-label'));
    if (!ids.length) lane.append(el('p','暂无执行中或待执行任务','empty'));
    const row = el('div',null,'queue-row');
    for (const [index,id] of ids.entries()) {
      const task = tasks.get(id);
      if (connected && index) {
        const edge = el('span',null,'queue-edge');
        edge.dataset.source = ids[index - 1]; edge.dataset.target = id;
        edge.title = ids[index - 1] + ' ⇢ ' + id + '（计划排队，非硬依赖）';
        edge.setAttribute('role','img'); edge.setAttribute('aria-label',edge.title);
        row.append(edge);
      }
      const node = taskCard(task,progress.get(id),flows);
      node.classList.add('queue-node');
      if (task.status === 'pending' && task.estimate.reason) {
        node.append(el('div',task.estimate.reason,'queue-reason'));
      }
      if (task.not_before) node.append(el('div','不早于 ' + when(task.not_before),'queue-reason'));
      row.append(node);
    }
    lane.append(row); viewport.append(lane);
  };
  for (const lane of plan.queues.lanes) addLane(instanceLabel(lane.instance),lane.tasks,true);
  for (const group of plan.queues.other) addLane(group.label,group.tasks,false);
  if (!plan.tasks.length) viewport.append(el('p','暂无任务','empty'));
  viewport.addEventListener('scroll',() => { scrollLeft = viewport.scrollLeft; scrollTop = viewport.scrollTop; });
  section.append(viewport);
  $('diagram').replaceChildren(section);
  viewport.scrollLeft = scrollLeft; viewport.scrollTop = scrollTop;
}
function renderDiagram() {
  if (diagramMode === 'queue' && plan.queues) { renderQueues(); return; }

  const graph = plan.graph || {nodes:[],edges:[],columns:0,rows:0};
  const taskById = new Map(plan.tasks.map(task => [task.id,task]));
  const flowById = new Map(plan.flows.map(flow => [flow.id,flow]));
  const section = el('section',null,'diagram');
  const heading = el('div',null,'diagram-header');
  const title = el('div',null,'diagram-title');
  title.append(el('h2','任务流程图'));
  title.append(el('p',plan.stats.flows + ' 条流程 · ' + plan.stats.tasks + ' 个任务 · 画布可横向滚动 · 箭头表示前置依赖','diagram-sub'));
  heading.append(title);
  diagramSwitch(heading);
  section.append(heading);
  if (!graph.nodes.length) {
    section.append(el('div','暂无任务','empty'));
    $('diagram').replaceChildren(section);
    return;
  }
  section.append(flowIndex());
  if (!graph.edges.length) section.append(el('p','未登记前置依赖；独立实验的同机先后安排见执行队列。','diagram-hint'));
  const viewport = el('div',null,'canvas-viewport');
  viewport.setAttribute('role','group');
  viewport.setAttribute('aria-label','任务流程图画布，可横向滚动');
  const canvasW = CANVAS_PAD * 2 + Math.max(0, graph.columns - 1) * COL_PITCH + NODE_W;
  const canvasH = CANVAS_PAD * 2 + Math.max(1, graph.rows) * ROW_PITCH;
  const canvas = el('div',null,'canvas');
  canvas.setAttribute('aria-label','任务依赖画布');
  css(canvas,'width:' + canvasW + 'px;height:' + canvasH + 'px');
  const positions = new Map(graph.nodes.map(node => [node.id,node]));
  const pointX = position => CANVAS_PAD + position.layer * COL_PITCH;
  const pointY = position => CANVAS_PAD + position.row * ROW_PITCH + PORT_Y;
  /* 先画连线，再放节点：节点永远盖在线上方。跨层依赖按服务端路点分段走直线。 */
  for (const edge of graph.edges) {
    const source = positions.get(edge.source), target = positions.get(edge.target);
    if (!source || !target) continue;
    const addSegment = (from, to, arrow) => {
      const dx = to.x - from.x, dy = to.y - from.y;
      const length = Math.hypot(dx,dy);
      if (!(length > 0)) return;
      const segment = el('span',null,'canvas-edge' + (arrow ? ' arrow' : ''));
      css(segment,'left:' + from.x + 'px;top:' + from.y + 'px;width:' + length
        + 'px;transform:rotate(' + Math.atan2(dy,dx) + 'rad)');
      segment.dataset.source = edge.source;
      segment.dataset.target = edge.target;
      segment.title = edge.source + ' → ' + edge.target;
      segment.setAttribute('aria-hidden','true');
      canvas.append(segment);
    };
    let from = {x:pointX(source) + NODE_W, y:pointY(source)};
    for (const waypoint of edge.waypoints || []) {
      const left = {x:pointX(waypoint), y:pointY(waypoint)};
      const right = {x:pointX(waypoint) + NODE_W, y:pointY(waypoint)};
      addSegment(from,left,false);
      addSegment(left,right,false);
      from = right;
    }
    addSegment(from,{x:pointX(target), y:pointY(target)},true);
  }
  for (const position of graph.nodes) {
    const task = taskById.get(position.id);
    const node = taskCard(task,position.progress,flowById);
    node.classList.add('canvas-node');
    css(node,'left:' + pointX(position) + 'px;top:' + (CANVAS_PAD + position.row * ROW_PITCH - 8) + 'px');
    canvas.append(node);
  }
  viewport.append(canvas);
  viewport.addEventListener('scroll',() => {
    scrollLeft = viewport.scrollLeft;
    scrollTop = viewport.scrollTop;
  });
  section.append(viewport);
  $('diagram').replaceChildren(section);
  viewport.scrollLeft = scrollLeft;
  viewport.scrollTop = scrollTop;
}
function render() {
  if (!plan) return;
  $('title').textContent = plan.name;
  document.title = 'TrainOps · ' + plan.name;
  $('updated').textContent = '更新 ' + when(plan.updated_at) + ' · rev ' + plan.revision;
  renderTokenButton();
  renderInstances();
  renderSummary();
  renderDiagram();
}
async function refresh() {
  if (loading) return;
  loading = true; $('refresh').disabled = true;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(),8000);
  try {
    const response = await fetch('/api/plan',{cache:'no-store',signal:controller.signal});
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || '读取失败');
    plan = data; $('error').classList.add('hidden'); render();
  } catch (error) {
    $('error').textContent = '无法读取最新计划：' + error.message + (plan ? '（当前显示上次读取的数据）' : '');
    $('error').classList.remove('hidden');
  } finally { clearTimeout(timer); loading = false; $('refresh').disabled = false; }
}
function theme(value) {
  document.documentElement.dataset.theme = value;
  $('theme').textContent = value === 'dark' ? '浅色模式' : '深色模式';
  try { localStorage.setItem('trainops-theme',value); } catch {}
}
let initial = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
try { initial = localStorage.getItem('trainops-theme') || initial; } catch {}
theme(initial === 'dark' ? 'dark' : 'light');
$('theme').addEventListener('click',() => theme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
$('refresh').addEventListener('click',refresh);
$('token').addEventListener('click',openToken);
/* 页面在后台时不做无谓轮询；回到前台后最多 10 秒内自动刷新一次。 */
refresh(); setInterval(() => { if (!document.hidden) refresh(); },10000);
</script>

<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TrainOps · 项目计划</title>
<style>
:root { color-scheme:light; --page:#f8f8f6; --surface:#ffffff; --ink:#111110; --secondary:#575652; --line:#e2e1da; --accent:#2563eb; --accent-soft:rgba(37,99,235,.16); --good:#15803d; --good-soft:rgba(21,128,61,.18); --warning:#d97706; --warning-soft:rgba(217,119,6,.18); --critical:#dc2626; --critical-soft:rgba(220,38,38,.18); --soft:#f1f0ec; --cursor:#e11d48; }
:root[data-theme="dark"] { color-scheme:dark; --page:#0e0e0d; --surface:#181817; --ink:#f5f5f3; --secondary:#b5b4aa; --line:#32322f; --accent:#3b82f6; --accent-soft:rgba(59,130,246,.22); --good:#22c55e; --good-soft:rgba(34,197,94,.22); --warning:#f59e0b; --warning-soft:rgba(245,158,11,.22); --critical:#ef4444; --critical-soft:rgba(239,68,68,.22); --soft:#242422; --cursor:#fb7185; }
* { box-sizing:border-box; }
body { margin:0; background:var(--page); color:var(--ink); font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
main { max-width:1440px; margin:auto; padding:26px 24px 44px; }
header { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; margin-bottom:16px; }
.brand { font-size:12px; font-weight:700; letter-spacing:.12em; color:var(--secondary); }
h1 { font-size:24px; margin:4px 0; line-height:1.3; }
h2 { font-size:16px; margin:0; }
p { margin:5px 0; }
.meta,.muted,small { color:var(--secondary); }
.controls { display:flex; gap:8px; align-items:center; }
button { border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:6px; font:inherit; padding:6px 10px; cursor:pointer; }
button:hover { background:var(--soft); }
button:focus-visible,summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.notice { border-left:3px solid var(--accent); background:var(--surface); padding:9px 14px; margin:12px 0; border-radius:0 6px 6px 0; }
#error { border-left-color:var(--critical); }
.hidden { display:none; }
.instances { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px; margin:10px 0 16px; }
.instance { padding:12px 14px; border:1px solid var(--line); border-radius:8px; background:var(--surface); overflow-wrap:anywhere; }
.instance-title { display:flex; justify-content:space-between; gap:10px; font-weight:600; }
.instance p { margin:4px 0 0; font-size:13px; }
#summary { margin:14px 0 10px; font-weight:500; }
.flow { margin:16px 0; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface); }
.flow-header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; background:var(--soft); }
.gantt-wrap { overflow-x:auto; }
.gantt { min-width:920px; }
.gantt-head,.gantt-row { display:grid; grid-template-columns:330px minmax(560px,1fr); border-bottom:1px solid var(--line); }
.gantt-row:last-child { border-bottom:0; }
.gantt-head { background:var(--surface); font-size:12px; color:var(--secondary); font-weight:500; }
.gantt-col-info,.gantt-info { padding:11px 14px; border-right:1px solid var(--line); overflow-wrap:anywhere; }
.gantt-axis { position:relative; height:36px; padding:0 14px; display:flex; align-items:center; justify-content:space-between; font-variant-numeric:tabular-nums; overflow:hidden; }
.gantt-tick { position:relative; z-index:1; background:var(--surface); padding:0 4px; border-radius:3px; font-size:11px; }
.gantt-track { position:relative; min-height:74px; padding:14px 0; overflow:hidden; background:repeating-linear-gradient(90deg,transparent 0,transparent calc(25% - 1px),var(--soft) calc(25% - 1px),var(--soft) 25%); }
.flow-progress-line { position:absolute; top:0; bottom:0; width:0; border-left:2px dashed var(--cursor); z-index:4; pointer-events:none; }
.flow-progress-tag { position:absolute; top:3px; left:4px; background:var(--cursor); color:#fff; font-size:11px; font-weight:600; padding:1px 6px; border-radius:4px; white-space:nowrap; line-height:1.4; }
.gantt-lane { position:relative; height:28px; margin:0 14px; }
.gantt-bar { position:absolute; top:0; height:28px; min-width:8px; border-radius:5px; border:1px solid var(--line); background:var(--soft); overflow:visible; display:flex; align-items:center; }
.gantt-bar.running { border-color:var(--accent); background:var(--accent-soft); }
.gantt-bar.done { border-color:var(--good); background:var(--good-soft); }
.gantt-bar.blocked { border-color:var(--warning); background:var(--warning-soft); }
.gantt-bar.failed { border-color:var(--critical); background:var(--critical-soft); }
.gantt-bar.is-unknown { border-style:dashed; }
.gantt-bar-fill { position:absolute; left:0; top:0; bottom:0; border-radius:4px 0 0 4px; background:var(--accent); opacity:.35; pointer-events:none; }
.gantt-bar.done .gantt-bar-fill { background:var(--good); opacity:.42; border-radius:4px; }
.gantt-bar.blocked .gantt-bar-fill { background:var(--warning); opacity:.4; }
.gantt-bar.failed .gantt-bar-fill { background:var(--critical); opacity:.4; }
.gantt-progress-line { position:absolute; top:-6px; bottom:-6px; width:3px; margin-left:-1.5px; background:var(--cursor); border-radius:2px; z-index:5; box-shadow:0 0 0 1px var(--surface); }
.gantt-progress-badge { position:absolute; top:-16px; left:50%; transform:translateX(-50%); background:var(--cursor); color:#fff; font-size:10px; font-weight:700; padding:0 4px; border-radius:3px; line-height:1.4; white-space:nowrap; font-variant-numeric:tabular-nums; }
.gantt-bar-label { position:relative; z-index:2; padding:0 8px; font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.gantt-eta { margin:7px 14px 0; font-size:12px; color:var(--secondary); display:flex; gap:10px; flex-wrap:wrap; font-variant-numeric:tabular-nums; position:relative; z-index:2; }
.id { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12px; }
.copy { border:1px solid var(--line); padding:1px 6px; background:var(--soft); border-radius:4px; font-weight:600; }
.status { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; font-size:12px; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--secondary); flex-shrink:0; }
.running .dot { background:var(--accent); }
.done .dot,.on .dot { background:var(--good); }
.blocked .dot,.starting .dot { background:var(--warning); }
.failed .dot,.unreachable .dot { background:var(--critical); }
.task-top { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.task-name { font-weight:600; margin:4px 0 2px; }
.tags { margin-top:4px; font-size:12px; color:var(--secondary); display:flex; gap:8px; flex-wrap:wrap; font-variant-numeric:tabular-nums; }
details { margin-top:6px; }
summary { cursor:pointer; color:var(--secondary); font-size:12px; width:fit-content; }
dl { font-size:12px; margin:6px 0 0; }
dt { color:var(--secondary); margin-top:4px; }
dd { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; }
.empty { padding:22px 16px; color:var(--secondary); }
footer { margin-top:22px; border-top:1px solid var(--line); padding-top:12px; font-size:12px; color:var(--secondary); }
@media(max-width:650px) { main { padding:16px 12px; } header { flex-direction:column; gap:10px; } h1 { font-size:20px; } }
@media(forced-colors:active) { .dot,.gantt-progress-line { border:2px solid CanvasText; } .notice,.gantt-bar { border:1px solid CanvasText; } }
</style>
</head>
<body>
<main>
<header>
  <div><div class="brand">TRAINOPS / GANTT PLAN</div><h1 id="title">项目计划</h1><p class="meta" id="updated">正在读取本地计划…</p></div>
  <div class="controls"><button id="refresh" type="button">立即刷新</button><button id="theme" type="button" aria-label="切换明暗主题">深色模式</button></div>
</header>
<div class="notice">只读甘特图面板 · 每 10 秒自动刷新。每个流程以连续甘特图展示节点起止与大致完成时间，红色竖线标出任务进度。</div>
<div class="notice hidden" id="error" role="alert"></div>
<section aria-label="实例分配"><h2>实例分配</h2><div class="instances" id="instances"></div></section>
<p class="meta" id="monitor"></p>
<div id="summary" aria-live="polite"></div>
<div id="flows"></div>
<footer>修改计划可直接对 agent 说：“将 F02-T02 换到 I01，依赖改为 F01-T02，预计 25 分钟”。点击编号即可复制。</footer>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const names = {pending:'待执行',running:'执行中',blocked:'阻塞',done:'已完成',failed:'失败',cancelled:'已取消',unknown:'未观测',off:'已关机',starting:'开机中',on:'开机',unreachable:'不可达'};
let plan = null;
let loading = false;
const opened = new Set();
function el(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined && text !== null) node.textContent = String(text);
  if (className) node.className = className;
  return node;
}
function css(node, styleText) {
  node.setAttribute('style', styleText);
  return node;
}
function when(value) {
  if (!value) return '待估';
  return new Date(value).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
}
function status(value) {
  const node = el('span',null,'status ' + value);
  node.append(el('span',null,'dot'),el('span',names[value] || value));
  return node;
}
function copy(value) {
  const button = el('button',value,'copy id');
  button.type = 'button';
  button.title = '复制编号 ' + value;
  button.addEventListener('click',async () => {
    try { await navigator.clipboard.writeText(value); button.textContent = '已复制'; }
    catch { button.textContent = value + '（请选中复制）'; }
    setTimeout(() => { button.textContent = value; },1600);
  });
  return button;
}
function detail(task) {
  const node = el('details');
  node.open = opened.has(task.id);
  node.addEventListener('toggle',() => { if(node.open) opened.add(task.id); else opened.delete(task.id); });
  node.append(el('summary','运行记录 / 备注'));
  const list = el('dl');
  const fields = {owner:'负责人',command:'实际命令',commit:'代码版本',session:'进程 / 会话',log:'日志路径',output:'产物位置',note:'备注'};
  for (const [key,label] of Object.entries(fields)) {
    if (task[key]) list.append(el('dt',label),el('dd',task[key]));
  }
  if (task.started_at) list.append(el('dt','实际开始'),el('dd',when(task.started_at)));
  if (task.finished_at) list.append(el('dt','实际结束'),el('dd',when(task.finished_at)));
  if (task.checked_at) list.append(el('dt','最近巡检'),el('dd',when(task.checked_at)));
  if (!list.children.length) list.append(el('dd','尚无运行记录'));
  node.append(list);
  return node;
}
function taskProgress(task) {
  if (task.status === 'done') return 100;
  if (task.progress !== null && task.progress !== undefined) return Math.max(0, Math.min(100, Math.round(Number(task.progress))));
  return 0;
}
function computeSpans(tasks, refIso) {
  const baseMs = Date.parse(refIso) || Date.now();
  const spans = {};
  const flowEnds = {};
  for (const task of tasks) {
    const startIso = task.started_at || (task.estimate && task.estimate.start);
    const finishIso = task.finished_at || (task.estimate && task.estimate.finish);
    const depEnds = task.deps.map(d => spans[d] ? spans[d].endMs : 0);
    const prevFlowEnd = flowEnds[task.flow] || 0;
    const startMs = prevFlowEnd || Math.max(...depEnds, 0) || (startIso ? Date.parse(startIso) : baseMs);
    const prog = taskProgress(task);
    let durMs = 0;
    if (startIso && finishIso && Date.parse(finishIso) > Date.parse(startIso)) {
      durMs = Date.parse(finishIso) - Date.parse(startIso);
    } else if (task.status === 'running' && prog > 0 && prog < 100 && task.progress_at && task.started_at) {
      const obsMs = Date.parse(task.progress_at), stMs = Date.parse(task.started_at);
      if (obsMs > stMs) durMs = (obsMs - stMs) * (100 / prog);
    }
    if (!durMs) durMs = Math.max(10, Number(task.duration_minutes) || 30) * 60000;
    const endMs = startMs + Math.max(5 * 60000, durMs);
    flowEnds[task.flow] = endMs;
    spans[task.id] = {startMs, endMs, exact: Boolean(finishIso), progress: prog};
  }
  return spans;
}
function render() {
  if (!plan) return;
  $('title').textContent = plan.name;
  document.title = 'TrainOps · ' + plan.name;
  $('updated').textContent = '计划更新 ' + when(plan.updated_at) + ' · revision ' + plan.revision + ' · 页面读取 ' + when(plan.generated_at);
  const instanceNodes = plan.instances.map(item => {
    const node = el('article',null,'instance');
    const heading = el('div',null,'instance-title');
    const label = el('span'); label.append(copy(item.id),document.createTextNode(' ' + item.name));
    heading.append(label,status(item.status));
    node.append(heading,el('p',item.ssh_alias + ' · ' + item.autodl_id,'muted id'));
    const tasks = plan.tasks.filter(task => task.instance === item.id);
    const active = tasks.filter(task => task.status === 'running');
    node.append(el('p',active.length ? '占用：' + active.map(task => task.id + (task.owner ? ' / ' + task.owner : '')).join('、') : '无已登记的执行中任务'));
    const queued = tasks.filter(task => ['pending','blocked'].includes(task.status)).length;
    node.append(el('p','后续任务 ' + queued + ' · 最近观测 ' + (item.observed_at ? when(item.observed_at) : '未登记'),'muted'));
    if (item.note) node.append(el('small',item.note));
    return node;
  });
  $('instances').replaceChildren(...(instanceNodes.length ? instanceNodes : [el('p','尚未登记实例，本地任务可使用 local。','muted')]));
  const monitor = plan.monitor;
  const expired = monitor.expires_at && new Date(monitor.expires_at) <= new Date(plan.generated_at);
  $('monitor').textContent = '巡检：' + (monitor.schedule_id || '未登记调度器') + (monitor.expires_at ? ' · ' + (expired ? '已过期 ' : '有效至 ') + when(monitor.expires_at) : '') + ' · ' + monitor.note;
  const counts = Object.fromEntries(Object.keys(names).map(key => [key,0]));
  plan.tasks.forEach(task => counts[task.status]++);
  $('summary').textContent = plan.flows.length + ' 条流程 / ' + plan.tasks.length + ' 个任务 · ' + ['running','pending','blocked','done','failed','cancelled'].map(key => names[key] + ' ' + counts[key]).join(' · ');
  const spans = computeSpans(plan.tasks, plan.generated_at || plan.updated_at);
  const flows = [];
  for (const flow of plan.flows) {
    const all = plan.tasks.filter(task => task.flow === flow.id);
    const section = el('section',null,'flow');
    const heading = el('div',null,'flow-header');
    const title = el('h2'); title.append(copy(flow.id),document.createTextNode(' ' + flow.name));
    const unfinished = all.filter(task => task.status !== 'done');
    const hasUnknown = all.some(task => !task.estimate.finish);
    const dates = all.map(task => task.estimate.finish).filter(Boolean).map(value => new Date(value).getTime());
    const end = dates.length ? new Date(Math.max(...dates)).toISOString() : null;
    const avgProg = all.length ? Math.round(all.reduce((s, t) => s + spans[t.id].progress, 0) / all.length) : 0;
    heading.append(title,el('span',all.filter(task => task.status === 'done').length + '/' + all.length + ' 完成 · 流程总进度 ' + avgProg + '% · ' +
      (hasUnknown || !end ? '流程完成待估' : (unfinished.length ? '预计完成 ' : '实际完成 ') + when(end)),'muted'));
    section.append(heading);
    if (!all.length) { section.append(el('div','暂无任务','empty')); flows.push(section); continue; }
    const minMs = spans[all[0].id].startMs;
    const maxMs = spans[all[all.length - 1].id].endMs;
    const totalMs = Math.max(maxMs - minMs, 5 * 60000);
    const geom = {};
    for (const t of all) {
      const s = spans[t.id];
      const left = ((s.startMs - minMs) / totalMs) * 100;
      const right = ((s.endMs - minMs) / totalMs) * 100;
      geom[t.id] = {left, width: right - left, progress: s.progress, exact: s.exact};
    }
    const activeTask = [...all].reverse().find(t => t.status === 'running') ||
      [...all].reverse().find(t => t.status === 'done' || spans[t.id].progress > 0) || all[0];
    const ag = geom[activeTask.id];
    const flowCursorPct = Math.max(0, Math.min(100, ag.left + ag.width * (ag.progress / 100)));
    const flowCursorText = activeTask.id + ' 进度 ' + ag.progress + '%';
    const wrap = el('div',null,'gantt-wrap');
    wrap.tabIndex = 0; wrap.setAttribute('aria-label',flow.name + '甘特图');
    const gantt = el('div',null,'gantt');
    const head = el('div',null,'gantt-head');
    head.append(el('div','任务节点 / 实例 / 依赖','gantt-col-info'));
    const axis = el('div',null,'gantt-axis');
    for (const ratio of [0, 0.25, 0.5, 0.75, 1]) {
      axis.append(el('span',when(new Date(minMs + totalMs * ratio).toISOString()),'gantt-tick'));
    }
    const axisCursor = css(el('div',null,'flow-progress-line'),'left:' + flowCursorPct.toFixed(1) + '%');
    axisCursor.append(el('span','竖线: ' + flowCursorText,'flow-progress-tag'));
    axis.append(axisCursor);
    head.append(axis);
    gantt.append(head);
    const body = el('div',null,'gantt-body');
    for (const task of all) {
      const g = geom[task.id];
      const row = el('div',null,'gantt-row');
      const info = el('div',null,'gantt-info');
      const top = el('div',null,'task-top');
      top.append(copy(task.id),status(task.status));
      const meta = el('div',null,'tags');
      meta.append(
        el('span','实例: ' + (task.instance || '未分配'),'id'),
        el('span','进度: ' + g.progress + '%'),
        el('span','依赖: ' + (task.deps.length ? task.deps.join('、') : '无'),'id')
      );
      if (task.estimate.ready) meta.append(el('span','◇ 已就绪'));
      if (task.status === 'running' && task.estimate.stale) meta.append(el('span','⚠ 观测过期'));
      info.append(top,el('div',task.name,'task-name'),meta,detail(task));
      const track = el('div',null,'gantt-track');
      track.append(css(el('div',null,'flow-progress-line'),'left:' + flowCursorPct.toFixed(1) + '%'));
      const lane = el('div',null,'gantt-lane');
      const bar = css(
        el('div',null,'gantt-bar ' + task.status + (g.exact ? '' : ' is-unknown')),
        'left:' + g.left.toFixed(1) + '%;width:' + g.width.toFixed(1) + '%'
      );
      bar.append(css(el('div',null,'gantt-bar-fill'),'width:' + g.progress + '%'));
      const progLine = css(el('div',null,'gantt-progress-line'),'left:' + g.progress + '%');
      progLine.title = task.id + ' 任务进度 ' + g.progress + '%';
      progLine.append(el('span',g.progress + '%','gantt-progress-badge'));
      bar.append(progLine,el('span',task.id + ' · ' + (task.instance || '未分配'),'gantt-bar-label id'));
      lane.append(bar);
      const eta = el('div',null,'gantt-eta');
      if (task.status === 'done') {
        eta.append(el('span','✓ 实际完成 ' + when(task.finished_at)));
      } else if (['failed','cancelled'].includes(task.status)) {
        eta.append(el('span','实际结束 ' + when(task.finished_at)));
      } else {
        eta.append(
          el('span',(task.status === 'running' ? '开始 ' : '预计开始 ') + when(task.estimate.start)),
          el('span','预计完成 ' + when(task.estimate.finish))
        );
      }
      if (task.duration_minutes !== null) eta.append(el('span','预计耗时 ' + task.duration_minutes + 'm'));
      if (task.estimate.reason) eta.append(el('span',task.estimate.reason));
      track.append(lane,eta);
      row.append(info,track);
      body.append(row);
    }
    gantt.append(body);
    wrap.append(gantt);
    section.append(wrap);
    flows.push(section);
  }
  $('flows').replaceChildren(...(flows.length ? flows : [el('div','计划为空，请让 agent 添加流程和任务。','empty')]));
}
async function refresh() {
  if (loading) return;
  loading = true; $('refresh').disabled = true;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(),8000);
  try {
    const response = await fetch('/api/plan',{cache:'no-store',signal:controller.signal});
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || '读取失败');
    plan = data; $('error').classList.add('hidden'); render();
  } catch (error) {
    $('error').textContent = '无法读取最新计划：' + error.message + (plan ? '。下方保留的是上次读取的数据，可能已过期。' : '。请检查服务及 plan.json。');
    $('error').classList.remove('hidden');
  } finally { clearTimeout(timer); loading = false; $('refresh').disabled = false; }
}
function theme(value) {
  document.documentElement.dataset.theme = value;
  $('theme').textContent = value === 'dark' ? '浅色模式' : '深色模式';
  try { localStorage.setItem('trainops-theme',value); } catch {}
}
let initial = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
try { initial = localStorage.getItem('trainops-theme') || initial; } catch {}
theme(initial === 'dark' ? 'dark' : 'light');
$('theme').addEventListener('click',() => theme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
$('refresh').addEventListener('click',refresh);
refresh(); setInterval(refresh,10000);
</script>
</body>
</html>

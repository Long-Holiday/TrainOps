<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TrainOps · 项目计划</title>
<style>
:root { color-scheme:light; --page:#f6f7f9; --surface:#ffffff; --ink:#141518; --secondary:#60646c; --line:#e4e6eb; --accent:#2563eb; --accent-soft:rgba(37,99,235,.12); --good:#16a34a; --good-soft:rgba(22,163,74,.14); --warning:#d97706; --warning-soft:rgba(217,119,6,.14); --critical:#dc2626; --critical-soft:rgba(220,38,38,.14); --soft:#f0f2f5; --cursor:#e11d48; }
:root[data-theme="dark"] { color-scheme:dark; --page:#0f1115; --surface:#181b20; --ink:#f3f4f6; --secondary:#9ca3af; --line:#2b303b; --accent:#3b82f6; --accent-soft:rgba(59,130,246,.2); --good:#22c55e; --good-soft:rgba(34,197,94,.2); --warning:#f59e0b; --warning-soft:rgba(245,158,11,.2); --critical:#ef4444; --critical-soft:rgba(239,68,68,.2); --soft:#22262f; --cursor:#fb7185; }
* { box-sizing:border-box; }
body { margin:0; background:var(--page); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; }
main { max-width:1420px; margin:auto; padding:22px 26px 40px; }
header { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-bottom:16px; }
h1 { font-size:24px; font-weight:650; margin:0 0 3px; line-height:1.3; }
h2 { font-size:17px; font-weight:600; margin:0; line-height:1.35; }
p { margin:0; }
.meta,.muted { color:var(--secondary); font-size:14px; }
.controls { display:flex; gap:8px; align-items:center; }
button { border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:6px; font:inherit; font-size:14px; font-weight:500; padding:6px 14px; cursor:pointer; }
button:hover { background:var(--soft); }
button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.notice { border-left:3px solid var(--critical); background:var(--surface); padding:9px 14px; margin:10px 0; border-radius:0 6px 6px 0; font-size:14px; }
.hidden { display:none; }
#summary { font-size:15px; font-weight:500; margin-bottom:12px; }
.instances { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; margin-bottom:16px; }
.instance { padding:12px 16px; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
.instance-title { display:flex; justify-content:space-between; gap:8px; font-size:15.5px; font-weight:600; align-items:center; }
.instance p { margin-top:5px; font-size:14px; }
.flow { margin:16px 0; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface); }
.flow-header { padding:11px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; background:var(--soft); }
.gantt-wrap { overflow-x:auto; }
.gantt { min-width:920px; }
.gantt-head,.gantt-row { display:grid; grid-template-columns:310px minmax(580px,1fr); border-bottom:1px solid var(--line); align-items:stretch; }
.gantt-row:last-child { border-bottom:0; }
.gantt-head { background:var(--surface); font-size:14px; color:var(--secondary); font-weight:500; }
.gantt-col-info { padding:9px 16px; border-right:1px solid var(--line); display:flex; align-items:center; }
.gantt-info { padding:10px 16px; border-right:1px solid var(--line); display:flex; flex-direction:column; justify-content:center; gap:5px; overflow-wrap:anywhere; }
.gantt-axis { position:relative; height:36px; padding:0 16px; display:flex; align-items:center; justify-content:space-between; font-variant-numeric:tabular-nums; }
.gantt-tick { position:relative; z-index:1; background:var(--surface); padding:0 4px; border-radius:3px; font-size:13px; color:var(--secondary); }
.gantt-track { position:relative; padding:9px 0 8px; display:flex; flex-direction:column; justify-content:center; background:repeating-linear-gradient(90deg,transparent 0,transparent calc(25% - 1px),var(--soft) calc(25% - 1px),var(--soft) 25%); }
.flow-progress-line { position:absolute; top:0; bottom:0; width:0; border-left:2px solid var(--cursor); z-index:7; pointer-events:none; }
.flow-progress-tag { position:absolute; top:6px; left:6px; background:var(--cursor); color:#fff; font-size:13px; font-weight:600; padding:1px 7px; border-radius:4px; white-space:nowrap; line-height:1.4; box-shadow:0 1px 3px rgba(0,0,0,.15); }
.flow-progress-line.align-left .flow-progress-tag { left:auto; right:6px; }
.gantt-lane { position:relative; height:28px; margin:0 16px; }
.gantt-bar { position:absolute; top:0; height:28px; min-width:16px; border-radius:5px; border:1px solid var(--line); background:var(--soft); display:flex; align-items:center; justify-content:space-between; padding:0 7px; gap:6px; overflow:hidden; }
.gantt-bar.running { border-color:var(--accent); background:var(--accent-soft); }
.gantt-bar.done { border-color:var(--good); background:var(--good-soft); }
.gantt-bar.blocked { border-color:var(--warning); background:var(--warning-soft); }
.gantt-bar.failed { border-color:var(--critical); background:var(--critical-soft); }
.gantt-bar.is-unknown { border-style:dashed; }
.gantt-bar-fill { position:absolute; left:0; top:0; bottom:0; background:var(--accent); opacity:.28; pointer-events:none; }
.gantt-bar.done .gantt-bar-fill { background:var(--good); opacity:.32; }
.gantt-bar.blocked .gantt-bar-fill { background:var(--warning); opacity:.3; }
.gantt-bar.failed .gantt-bar-fill { background:var(--critical); opacity:.3; }
.gantt-progress-line { position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--accent); z-index:3; pointer-events:none; }
.gantt-bar.done .gantt-progress-line { background:var(--good); }
.gantt-bar-label { position:relative; z-index:4; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.gantt-progress-badge { position:relative; z-index:5; background:var(--surface); color:var(--ink); border:1px solid var(--line); font-size:13px; font-weight:600; padding:0 6px; border-radius:4px; line-height:1.4; white-space:nowrap; font-variant-numeric:tabular-nums; margin-left:auto; flex-shrink:0; }
.gantt-eta { margin:5px 16px 0; font-size:13.5px; line-height:1.3; color:var(--secondary); display:flex; gap:10px; flex-wrap:wrap; font-variant-numeric:tabular-nums; position:relative; z-index:2; }
.id { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:13.5px; }
.copy { border:1px solid var(--line); padding:1px 7px; background:var(--soft); border-radius:4px; font-size:13.5px; font-weight:600; flex-shrink:0; }
.status { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; font-size:13.5px; font-weight:500; flex-shrink:0; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--secondary); flex-shrink:0; }
.running .dot { background:var(--accent); }
.done .dot,.on .dot { background:var(--good); }
.blocked .dot,.starting .dot { background:var(--warning); }
.failed .dot,.unreachable .dot { background:var(--critical); }
.task-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.task-title { display:flex; align-items:center; gap:7px; min-width:0; }
.task-name { font-weight:600; font-size:15.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tags { font-size:13.5px; color:var(--secondary); display:flex; gap:8px; flex-wrap:wrap; font-variant-numeric:tabular-nums; }
.empty { padding:20px 16px; color:var(--secondary); font-size:14px; }
@media(max-width:650px) { main { padding:14px 10px; } header { flex-direction:column; align-items:flex-start; gap:8px; } }
</style>
</head>
<body>
<main>
<header>
  <div><h1 id="title">项目计划</h1><p class="meta" id="updated">正在读取…</p></div>
  <div class="controls"><button id="refresh" type="button">刷新</button><button id="theme" type="button">深色模式</button></div>
</header>
<div class="notice hidden" id="error" role="alert"></div>
<div class="instances" id="instances"></div>
<div id="summary" aria-live="polite"></div>
<div id="flows"></div>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const names = {pending:'待执行',running:'执行中',blocked:'阻塞',done:'已完成',failed:'失败',cancelled:'已取消',unknown:'未观测',off:'已关机',starting:'开机中',on:'开机',unreachable:'不可达'};
let plan = null;
let loading = false;
function el(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined && text !== null) node.textContent = String(text);
  if (className) node.className = className;
  return node;
}
function css(node, styleText) {
  node.setAttribute('style', styleText);
  return node;
}
function when(value) {
  if (!value) return '待估';
  return new Date(value).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
}
function status(value) {
  const node = el('span',null,'status ' + value);
  node.append(el('span',null,'dot'),el('span',names[value] || value));
  return node;
}
function copy(value) {
  const button = el('button',value,'copy id');
  button.type = 'button';
  button.title = '复制 ' + value;
  button.addEventListener('click',async () => {
    try { await navigator.clipboard.writeText(value); button.textContent = '已复制'; }
    catch { button.textContent = value; }
    setTimeout(() => { button.textContent = value; },1200);
  });
  return button;
}
function taskProgress(task) {
  if (task.status === 'done') return 100;
  if (task.progress !== null && task.progress !== undefined) return Math.max(0, Math.min(100, Math.round(Number(task.progress))));
  return 0;
}
function computeSpans(tasks, refIso) {
  const baseMs = Date.parse(refIso) || Date.now();
  const spans = {};
  const flowEnds = {};
  for (const task of tasks) {
    const startIso = task.started_at || (task.estimate && task.estimate.start);
    const finishIso = task.finished_at || (task.estimate && task.estimate.finish);
    const depEnds = task.deps.map(d => spans[d] ? spans[d].endMs : 0);
    const prevFlowEnd = flowEnds[task.flow] || 0;
    const startMs = prevFlowEnd || Math.max(...depEnds, 0) || (startIso ? Date.parse(startIso) : baseMs);
    const prog = taskProgress(task);
    let durMs = 0;
    if (startIso && finishIso && Date.parse(finishIso) > Date.parse(startIso)) {
      durMs = Date.parse(finishIso) - Date.parse(startIso);
    } else if (task.status === 'running' && prog > 0 && prog < 100 && task.progress_at && task.started_at) {
      const obsMs = Date.parse(task.progress_at), stMs = Date.parse(task.started_at);
      if (obsMs > stMs) durMs = (obsMs - stMs) * (100 / prog);
    }
    if (!durMs) durMs = Math.max(10, Number(task.duration_minutes) || 30) * 60000;
    const endMs = startMs + Math.max(5 * 60000, durMs);
    flowEnds[task.flow] = endMs;
    spans[task.id] = {startMs, endMs, exact: Boolean(finishIso), progress: prog};
  }
  return spans;
}
function render() {
  if (!plan) return;
  $('title').textContent = plan.name;
  document.title = 'TrainOps · ' + plan.name;
  $('updated').textContent = '更新 ' + when(plan.updated_at) + ' · rev ' + plan.revision;
  const instanceNodes = plan.instances.map(item => {
    const node = el('article',null,'instance');
    const heading = el('div',null,'instance-title');
    const label = el('span'); label.append(copy(item.id),document.createTextNode(' ' + item.name));
    heading.append(label,status(item.status));
    const tasks = plan.tasks.filter(task => task.instance === item.id);
    const active = tasks.filter(task => task.status === 'running');
    const queued = tasks.filter(task => ['pending','blocked'].includes(task.status)).length;
    node.append(heading,el('p',item.ssh_alias + ' · ' + (active.length ? '运行 ' + active.map(t => t.id).join(',') : '空闲') + ' · 待跑 ' + queued,'muted id'));
    return node;
  });
  $('instances').replaceChildren(...instanceNodes);
  const counts = Object.fromEntries(Object.keys(names).map(key => [key,0]));
  plan.tasks.forEach(task => counts[task.status]++);
  $('summary').textContent = plan.flows.length + ' 条流程 / ' + plan.tasks.length + ' 个任务 · ' + ['running','pending','done','blocked','failed'].filter(k => counts[k] || k === 'running' || k === 'done').map(key => names[key] + ' ' + counts[key]).join(' · ');
  const spans = computeSpans(plan.tasks, plan.generated_at || plan.updated_at);
  const flows = [];
  for (const flow of plan.flows) {
    const all = plan.tasks.filter(task => task.flow === flow.id);
    const section = el('section',null,'flow');
    const heading = el('div',null,'flow-header');
    const title = el('h2'); title.append(copy(flow.id),document.createTextNode(' ' + flow.name));
    if (!all.length) { heading.append(title); section.append(heading,el('div','暂无任务','empty')); flows.push(section); continue; }
    const minMs = spans[all[0].id].startMs;
    const maxMs = spans[all[all.length - 1].id].endMs;
    const totalMs = Math.max(maxMs - minMs, 5 * 60000);
    const geom = {};
    for (const t of all) {
      const s = spans[t.id];
      const left = ((s.startMs - minMs) / totalMs) * 100;
      const right = ((s.endMs - minMs) / totalMs) * 100;
      geom[t.id] = {left, width: right - left, progress: s.progress, exact: s.exact};
    }
    const flowProgress = Math.max(0, Math.min(100, Math.round(all.reduce((s, t) => s + geom[t.id].width * (geom[t.id].progress / 100), 0))));
    const unfinished = all.filter(task => task.status !== 'done');
    const hasUnknown = all.some(task => !task.estimate.finish);
    const dates = all.map(task => task.estimate.finish).filter(Boolean).map(value => new Date(value).getTime());
    const end = dates.length ? new Date(Math.max(...dates)).toISOString() : null;
    heading.append(title,el('span',all.filter(task => task.status === 'done').length + '/' + all.length + ' 完成 · 总进度 ' + flowProgress + '% · ' +
      (hasUnknown || !end ? '完成待估' : (unfinished.length ? '预计 ' : '完成 ') + when(end)),'muted'));
    section.append(heading);
    const wrap = el('div',null,'gantt-wrap');
    const gantt = el('div',null,'gantt');
    const head = el('div',null,'gantt-head');
    head.append(el('div','任务节点','gantt-col-info'));
    const axis = el('div',null,'gantt-axis');
    for (const ratio of [0, 0.25, 0.5, 0.75, 1]) {
      axis.append(el('span',when(new Date(minMs + totalMs * ratio).toISOString()),'gantt-tick'));
    }
    const axisCursor = css(el('div',null,'flow-progress-line' + (flowProgress > 80 ? ' align-left' : '')),'left:' + flowProgress + '%');
    axisCursor.append(el('span','总进度 ' + flowProgress + '%','flow-progress-tag'));
    axis.append(axisCursor);
    head.append(axis);
    gantt.append(head);
    const body = el('div',null,'gantt-body');
    for (const task of all) {
      const g = geom[task.id];
      const row = el('div',null,'gantt-row');
      const info = el('div',null,'gantt-info');
      const top = el('div',null,'task-top');
      const titleWrap = el('div',null,'task-title');
      titleWrap.append(copy(task.id),el('span',task.name,'task-name'));
      top.append(titleWrap,status(task.status));
      const meta = el('div',null,'tags');
      meta.append(el('span',task.instance || '未分配','id'));
      if (task.deps.length) meta.append(el('span','依赖 ' + task.deps.join('、'),'id'));
      if (task.note) meta.append(el('span',task.note));
      info.append(top,meta);
      const track = el('div',null,'gantt-track');
      track.append(css(el('div',null,'flow-progress-line'),'left:' + flowProgress + '%'));
      const lane = el('div',null,'gantt-lane');
      const bar = css(
        el('div',null,'gantt-bar ' + task.status + (g.exact ? '' : ' is-unknown')),
        'left:' + g.left.toFixed(1) + '%;width:' + g.width.toFixed(1) + '%'
      );
      bar.append(
        css(el('div',null,'gantt-bar-fill'),'width:' + g.progress + '%'),
        css(el('div',null,'gantt-progress-line'),'left:' + g.progress + '%')
      );
      if (g.width >= 14) bar.append(el('span',task.id,'gantt-bar-label id'));
      bar.append(el('span',g.progress + '%','gantt-progress-badge'));
      lane.append(bar);
      const eta = el('div',null,'gantt-eta');
      if (task.status === 'done') {
        eta.append(el('span','✓ ' + when(task.finished_at) + ' 完成'));
      } else if (['failed','cancelled'].includes(task.status)) {
        eta.append(el('span',when(task.finished_at) + ' 结束'));
      } else {
        eta.append(el('span',(task.estimate.finish ? '预计 ' + when(task.estimate.finish) + ' 完成' : '完成待估') + (task.duration_minutes !== null ? ' (' + task.duration_minutes + 'm)' : '')));
      }
      track.append(lane,eta);
      row.append(info,track);
      body.append(row);
    }
    gantt.append(body);
    wrap.append(gantt);
    section.append(wrap);
    flows.push(section);
  }
  $('flows').replaceChildren(...(flows.length ? flows : [el('div','暂无计划','empty')]));
}
async function refresh() {
  if (loading) return;
  loading = true; $('refresh').disabled = true;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(),8000);
  try {
    const response = await fetch('/api/plan',{cache:'no-store',signal:controller.signal});
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || '读取失败');
    plan = data; $('error').classList.add('hidden'); render();
  } catch (error) {
    $('error').textContent = '无法读取最新计划：' + error.message + (plan ? '（当前显示上次读取的数据）' : '');
    $('error').classList.remove('hidden');
  } finally { clearTimeout(timer); loading = false; $('refresh').disabled = false; }
}
function theme(value) {
  document.documentElement.dataset.theme = value;
  $('theme').textContent = value === 'dark' ? '浅色模式' : '深色模式';
  try { localStorage.setItem('trainops-theme',value); } catch {}
}
let initial = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
try { initial = localStorage.getItem('trainops-theme') || initial; } catch {}
theme(initial === 'dark' ? 'dark' : 'light');
$('theme').addEventListener('click',() => theme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
$('refresh').addEventListener('click',refresh);
refresh(); setInterval(refresh,10000);
</script>
</body>
</html>
